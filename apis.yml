aid: syapse
name: Syapse
description: >-
  Syapse was a San Francisco precision-medicine software company, founded in 2008, that built a
  real-world evidence platform for community oncology. Its product integrated structured clinical
  data from health-system EHRs with genomic/NGS results to support molecular tumor boards, care
  coordination, quality improvement and life-sciences research, and it ran the Syapse Learning
  Health Network of community health systems alongside collaborations with Roche, Amgen and the
  US Department of Veterans Affairs. Syapse Holdings was acquired by N-Power Medicine in a
  stock-for-stock exchange that closed 2024-12-30 and was announced 2025-01-12; its network of
  1,000+ community oncologists, its data and technology stack, and its team were folded into
  N-Power Medicine's always-on community clinical-research model. The Syapse brand has since been
  fully retired: syapse.com now serves nothing but a 292-byte meta-refresh stub redirecting to
  npowermedicine.com, dated 2025-01-12. Syapse never published a public developer program, and no
  public API, OpenAPI/AsyncAPI/GraphQL contract, SDK or developer portal survives.
